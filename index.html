<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xingci - 首页</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        /* ========== 老电视开机动画 ========== */
        #tv-boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 扫描线效果 */
        .scanline {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.8), transparent);
            animation: scanMove 0.1s linear infinite;
            opacity: 0;
        }

        /* 水平展开的光带 */
        .tv-line {
            position: absolute;
            width: 0;
            height: 3px;
            background: #38bdf8;
            box-shadow: 0 0 20px #38bdf8, 0 0 40px #38bdf8, 0 0 60px rgba(56, 189, 248, 0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: lineExpand 0.8s ease-out forwards;
            animation-delay: 0.3s;
        }

        /* 屏幕展开遮罩 */
        .screen-expand {
            position: absolute;
            width: 0;
            height: 0;
            background: radial-gradient(ellipse at center, rgba(56, 189, 248, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: screenOpen 1.5s ease-out forwards;
            animation-delay: 0.5s;
        }

        /* 闪烁效果 */
        .tv-flicker {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            animation: flicker 0.15s ease-out forwards;
            animation-delay: 1.2s;
        }

        /* 最终全屏 */
        .screen-full {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #0f172a;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
            animation-delay: 1.5s;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes lineExpand {
            0% { width: 0; opacity: 1; }
            100% { width: 200%; opacity: 0; }
        }

        @keyframes screenOpen {
            0% { width: 0; height: 0; opacity: 1; }
            60% { width: 120vw; height: 120vh; opacity: 0.8; }
            100% { width: 150vw; height: 150vh; opacity: 0; }
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            25% { opacity: 0; }
            50% { opacity: 0.5; }
            75% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 动画结束后隐藏 */
        #tv-boot-screen.hidden {
            display: none;
        }

        /* ========== 主页面（初始隐藏） ========== */
        #main-content {
            opacity: 0;
            animation: contentFadeIn 0.8s ease-out forwards;
            animation-delay: 1.8s;
        }

        @keyframes contentFadeIn {
            to { opacity: 1; }
        }

        /* 导航栏样式 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: rgba(15, 23, 42, 0.9);
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .btn-login {
            padding: 8px 20px;
            border: 1px solid #38bdf8;
            border-radius: 20px;
            color: #38bdf8;
        }

        .btn-login:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* 首屏 Hero 区域 */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .cta-button {
            padding: 15px 40px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-radius: 30px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        /* 特性区域 */
        .features {
            padding: 80px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            background-color: #1e293b;
        }

        .feature-card {
            background-color: #0f172a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        .feature-card h3 {
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .feature-card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            nav ul { display: none; }
        }
    </style>
</head>
<body>

    <!-- ====== 老电视开机动画 ====== -->
    <div id="tv-boot-screen">
        <div class="scanline"></div>
        <div class="tv-line"></div>
        <div class="screen-expand"></div>
        <div class="tv-flicker"></div>
        <div class="screen-full"></div>
    </div>

    <!-- ====== 主页面内容 ====== -->
    <div id="main-content">
        <!-- 顶部导航 -->
        <header>
            <div class="logo">xingci</div>
            <nav>
                <ul>
                    <li><a href="#">首页</a></li>
                    <li><a href="#">产品</a></li>
                    <li><a href="#">关于</a></li>
                    <li><a href="#">联系</a></li>
                </ul>
            </nav>
            <a href="#" class="btn-login">登录</a>
        </header>

        <!-- 主视觉区域 -->
        <section class="hero">
            <h1>欢迎来到 xingci</h1>
            <p>探索未来的无限可能。我们致力于为您提供最优质的数字化体验与服务，开启全新的科技旅程。</p>
            <a href="#" class="cta-button">立即开始</a>
        </section>

        <!-- 特性介绍 -->
        <section class="features">
            <div class="feature-card">
                <h3>🚀 极速体验</h3>
                <p>采用最新的技术架构，为您提供流畅、无延迟的操作体验，让工作更高效。</p>
            </div>
            <div class="feature-card">
                <h3>🛡️ 安全可靠</h3>
                <p>多重加密技术与数据备份方案，全方位保障您的数据安全与隐私。</p>
            </div>
            <div class="feature-card">
                <h3>✨ 创新设计</h3>
                <p>简约而不简单的界面设计，符合人体工学的交互逻辑，让您爱不释手。</p>
            </div>
        </section>

        <!-- 页脚 -->
        <footer>
            <p>&copy; 2026 xingci. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // 动画结束后移除开机画面
        setTimeout(() => {
            document.getElementById('tv-boot-screen').classList.add('hidden');
        }, 2200);
    </script>

</body>
</html>
